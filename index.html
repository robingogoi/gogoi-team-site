<style>
  @font-face { font-family: Outfit; font-weight: 400; font-display: swap; src: url(Outfit_400Regular.ttf) format("truetype"); }
  @font-face { font-family: Outfit; font-weight: 700; font-display: swap; src: url(Outfit_700Bold.ttf) format("truetype"); }
  :root { --ink: #111111; --paper: #FFFFFF; --red: #E10A1E; --grey: #C9C9C9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper);
    font-family: Outfit, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .mark { width: 72px; height: 72px; }
  .word { font-weight: 700; font-size: 64px; letter-spacing: -0.03em; line-height: 1; }
  .word span { color: var(--red); }
  .soon { font-size: 20px; color: var(--grey); margin: 0; }
  a { color: var(--paper); text-underline-offset: 3px; }
  footer { font-size: 13px; color: var(--grey); text-align: center; line-height: 1.6; }
  @media (max-width: 420px) { .mark { width: 52px; height: 52px; } .word { font-size: 46px; } }
</style>
